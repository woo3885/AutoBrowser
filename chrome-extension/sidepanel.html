<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AutoBrowser</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <div><strong>AutoBrowser</strong><span id="page-title">현재 탭 연결 대기</span></div>
      <button id="settings-toggle" type="button" aria-label="설정 열기">⚙</button>
    </header>
    <section id="settings" hidden>
      <label for="backend-url">Backend 주소</label>
      <div class="settings-row">
        <input id="backend-url" type="url" placeholder="https://backend.example.com" />
        <button id="save-settings" type="button">저장</button>
      </div>
      <small>Railway Backend의 공개 HTTPS 주소를 입력하세요.</small>
    </section>
    <main id="messages" aria-live="polite"></main>
    <div id="status" role="status">확장 프로그램 아이콘을 누른 현재 탭에서 작동합니다.</div>
    <form id="composer">
      <textarea id="message" rows="3" maxlength="500" placeholder="현재 페이지에서 원하는 작업을 입력하세요"></textarea>
      <button id="send" type="submit">전송</button>
    </form>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
